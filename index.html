<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Happy 7k Stea ❤️</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
      }

      body {
        font-family: "Poppins", sans-serif;
      }

      /* Main viewport */
      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(
          135deg,
          #6a00ff 0%,
          #b517ff 30%,
          #ff4db8 70%,
          #ff1744 100%
        );
      }

      /* Background glow */
      .viewport::before {
        content: "";
        position: absolute;

        width: min(75vw, 500px);
        height: min(75vw, 500px);

        border-radius: 50%;
        background: #b517ff;

        top: -120px;
        left: -120px;

        opacity: 0.45;
        filter: blur(120px);
      }

      .viewport::after {
        content: "";
        position: absolute;

        width: min(75vw, 500px);
        height: min(75vw, 500px);

        border-radius: 50%;
        background: #ff1744;

        right: -120px;
        bottom: -120px;

        opacity: 0.45;
        filter: blur(120px);
      }

      .animation-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .container {
        width: 100%;
        max-width: 900px;

        padding: 20px;

        text-align: center;

        position: relative;
        z-index: 10;
      }

      /* Title */
      .message {
        color: white;

        font-size: clamp(2rem, 8vw, 4.5rem);

        font-weight: 900;
        line-height: 1.1;

        margin-bottom: 15px;

        text-shadow:
          0 0 10px #fff,
          0 0 20px #ff4db8,
          0 0 40px #b517ff,
          0 0 80px #ff1744;

        animation: titleGlow 2s infinite alternate;
      }

      @keyframes titleGlow {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.04);
        }
      }

      /* Click text */
      .click-me {
        color: white;

        font-size: clamp(1rem, 4vw, 1.7rem);

        font-weight: 700;

        margin-bottom: 10px;

        letter-spacing: 2px;

        text-shadow:
          0 0 10px #fff,
          0 0 20px #ff4db8;

        animation: bounce 1s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }

      /* Hand heart */
      .hand-heart {
        font-size: clamp(6rem, 25vw, 11rem);

        line-height: 1;

        cursor: pointer;
        user-select: none;

        animation: pulse 1.5s infinite;

        filter: drop-shadow(0 0 10px #ff4db8) drop-shadow(0 0 25px #b517ff)
          drop-shadow(0 0 50px #ff1744);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.08);
        }
      }

      /* Floating hearts */
      .heart {
        position: absolute;
        pointer-events: none;

        animation: floatUp linear forwards;
      }

      @keyframes floatUp {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.5);
        }

        10% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translateY(-120vh) translateX(var(--moveX)) scale(2);
        }
      }

      /* Burst hearts */
      .burst-heart {
        position: absolute;
        pointer-events: none;

        animation: burst 1.2s forwards;
      }

      @keyframes burst {
        from {
          opacity: 1;
          transform: translate(0, 0) scale(0.5);
        }

        to {
          opacity: 0;

          transform: translate(calc(var(--x) * 200px), calc(var(--y) * 200px))
            scale(2);
        }
      }

      /* Sparkles */
      .sparkle {
        position: absolute;
        pointer-events: none;

        animation: sparkleAnim 1s forwards;
      }

      @keyframes sparkleAnim {
        from {
          opacity: 1;
          transform: scale(0.5);
        }

        to {
          opacity: 0;
          transform: translateY(-80px) scale(2);
        }
      }

      @media (max-width: 480px) {
        .message {
          max-width: 90%;
          margin-left: auto;
          margin-right: auto;
          margin-bottom: 15px;
        }

        .container {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <div class="animation-layer" id="animationLayer"></div>

      <div class="container">
        <div class="message">Happy 7k Stea ❤️</div>

        <div class="click-me">✨ CLICK ME ✨</div>

        <div class="hand-heart" id="heartButton">🫶</div>
      </div>
    </div>

    <script>
      const heartButton = document.getElementById("heartButton");
      const animationLayer = document.getElementById("animationLayer");

      const hearts = ["💜", "💖", "💕", "💗", "❤️", "💘"];

      function createFloatingHeart() {
        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left = Math.random() * window.innerWidth + "px";

        heart.style.bottom = "-40px";

        heart.style.fontSize = 18 + Math.random() * 35 + "px";

        heart.style.setProperty("--moveX", Math.random() * 200 - 100 + "px");

        heart.style.animationDuration = 4 + Math.random() * 2 + "s";

        animationLayer.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }

      function createBurstHeart() {
        const heart = document.createElement("div");

        heart.className = "burst-heart";

        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

        const rect = heartButton.getBoundingClientRect();

        heart.style.left = rect.left + rect.width / 2 + "px";

        heart.style.top = rect.top + rect.height / 2 + "px";

        const angle = Math.random() * Math.PI * 2;

        heart.style.setProperty("--x", Math.cos(angle));

        heart.style.setProperty("--y", Math.sin(angle));

        animationLayer.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1200);
      }

      function createSparkle() {
        const sparkle = document.createElement("div");

        sparkle.className = "sparkle";
        sparkle.innerHTML = "✨";

        const rect = heartButton.getBoundingClientRect();

        sparkle.style.left =
          rect.left + rect.width / 2 + (Math.random() * 160 - 80) + "px";

        sparkle.style.top =
          rect.top + rect.height / 2 + (Math.random() * 160 - 80) + "px";

        sparkle.style.fontSize = 18 + Math.random() * 15 + "px";

        animationLayer.appendChild(sparkle);

        setTimeout(() => {
          sparkle.remove();
        }, 1000);
      }

      heartButton.addEventListener("click", () => {
        for (let i = 0; i < 60; i++) {
          createBurstHeart();
        }

        for (let i = 0; i < 40; i++) {
          setTimeout(() => {
            createFloatingHeart();
          }, i * 40);
        }

        for (let i = 0; i < 20; i++) {
          setTimeout(() => {
            createSparkle();
          }, i * 30);
        }
      });

      setInterval(() => {
        createFloatingHeart();
      }, 400);
    </script>
  </body>
</html>
